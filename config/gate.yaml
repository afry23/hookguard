# ctool-gate policy — gate.yaml
#
# Copy to ~/.claude/gate.yaml (single developer) or deploy via managed settings
# for the whole team (set CTOOL_GATE_POLICY to the shared path).
#
# Actions:  allow | deny | ask
#   allow — execute without prompting
#   deny  — block; reason is shown to Claude so it can explain the restriction
#   ask   — escalate to the user for interactive confirmation
#
# Evaluation order (most restrictive wins across all pipeline segments):
#   deny > ask > allow
#
# See README.md for the full schema reference.

version: 1

# Fallback action for tools not listed below.
# "deny" is the secure default: unknown tools are blocked until explicitly
# listed.  Change to "ask" if you prefer an interactive approval workflow for
# unknown tools.
default_action: deny

# Append-only JSONL audit log.  Every tool call and its decision is recorded
# here.  Leave empty ("") to disable.
audit_log: "~/.claude/gate-audit.jsonl"

# ─── flag aliases ────────────────────────────────────────────────────────────
#
# Maps short flags to their canonical long form, per tool and subcommand.
# deny_flags in tool sections only need the canonical form.
#
# Layout:  flag_aliases.<tool>.<subcommand>.<short>: <canonical>

flag_aliases:
  git:
    push:
      "-f": "--force"
    commit:
      "-n": "--no-verify"

# ─── opaque execution guard ───────────────────────────────────────────────────
#
# Fired when the command contains constructs that cannot be safely analysed
# statically: eval, exec, source, sh -c, xargs, command substitution $(...),
# arithmetic commands, control structures (if/while/for), etc.

opaque_execution_guard:
  action: ask

# ─── tool policies ────────────────────────────────────────────────────────────

tools:

  # ── git ──────────────────────────────────────────────────────────────────
  git:
    default_action: allow      # git is generally safe; specific subcommands
                               # and flags are restricted below.
    subcommands:

      push:
        # Force-pushing rewrites remote history and bypasses branch protections.
        deny_flags:
          - "--force"
          - "--force-with-lease"   # still dangerous on shared branches
          # -f is normalised to --force via flag_aliases above.

      commit:
        # --no-verify skips pre-commit and commit-msg hooks.
        deny_flags:
          - "--no-verify"
          # -n is normalised to --no-verify via flag_aliases above.

      tag:
        deny_flags:
          - "--delete"
          - "-d"

      config:
        # git config can permanently alter the global git setup.
        # Additionally, overriding core.hooksPath is a common technique to
        # silently disable git hooks.
        action: ask
        deny_args_regex:
          - 'core\.hooksPath'   # hook bypass attempt
          - '^--global$'        # modifying global git config

      rebase:
        # Interactive rebase (-i) is usually fine; deny only if you want
        # strict linear-history enforcement.  Uncomment to enable.
        #
        # deny_flags:
        #   - "--onto"
        action: allow

      # Catch-all: any git subcommand not listed above is allowed.
      "*":
        action: allow

  # ── rm ───────────────────────────────────────────────────────────────────
  rm:
    # Always require confirmation for any rm invocation.
    default_action: ask

  # ── curl / wget ───────────────────────────────────────────────────────────
  curl:
    default_action: ask     # network egress; ask before sending data out

  wget:
    default_action: ask

  # ── docker ───────────────────────────────────────────────────────────────
  docker:
    default_action: ask
    subcommands:
      run:
        deny_flags:
          - "--privileged"    # grants full host access
        deny_args_regex:
          - '^/$'                        # mounting root filesystem
          - '/var/run/docker\.sock'      # Docker socket (privilege escalation)
      build:
        action: allow
      ps:
        action: allow
      images:
        action: allow
      logs:
        action: allow
      inspect:
        action: allow

  # ── npm ───────────────────────────────────────────────────────────────────
  npm:
    default_action: allow
    subcommands:
      publish:
        action: ask   # publishing to a registry is irreversible
      install:
        action: allow
      run:
        action: allow
      test:
        action: allow

  # ── go ────────────────────────────────────────────────────────────────────
  go:
    default_action: allow
    subcommands:
      build:
        action: allow
      test:
        action: allow
      run:
        action: allow
      mod:
        action: allow
      generate:
        action: ask   # go:generate can run arbitrary programs

  # ── python / pip ──────────────────────────────────────────────────────────
  python:
    default_action: allow
  python3:
    default_action: allow

  pip:
    default_action: allow
    subcommands:
      install:
        action: allow
      uninstall:
        action: ask

  pip3:
    default_action: allow
    subcommands:
      install:
        action: allow
      uninstall:
        action: ask

  # ── common unix tools ─────────────────────────────────────────────────────
  ls:
    default_action: allow
  cat:
    default_action: allow
  grep:
    default_action: allow
  rg:
    default_action: allow
  find:
    default_action: allow
  echo:
    default_action: allow
  pwd:
    default_action: allow
  mkdir:
    default_action: allow
  cp:
    default_action: allow
  mv:
    default_action: allow
  touch:
    default_action: allow
  head:
    default_action: allow
  tail:
    default_action: allow
  wc:
    default_action: allow
  sort:
    default_action: allow
  uniq:
    default_action: allow
  jq:
    default_action: allow
  sed:
    default_action: allow
  awk:
    default_action: allow
  make:
    default_action: allow
  sh:
    # "sh script.sh" is treated as a named-script invocation (not opaque).
    # "sh -c '...'" is caught by the opaque_execution_guard before policy.
    default_action: ask
  bash:
    default_action: ask
